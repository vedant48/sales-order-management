# Render Blueprint: one free web service (backend) + one free PostgreSQL database.
# Dashboard -> New -> Blueprint -> select this repo. Fill the sync:false env vars when prompted.
services:
  - type: web
    name: sales-order-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/orders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-orders-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
databases:
  - name: sales-orders-db
    plan: free
